<svg width="1200" height="750" viewBox="0 0 1200 750" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="750" rx="16" fill="#0B0D11"/>
  <rect width="1200" height="750" rx="16" fill="url(#bg_radial)"/>

  <!-- Subtle Grid Lines -->
  <line x1="80" y1="120" x2="1120" y2="120" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>
  <line x1="80" y1="630" x2="1120" y2="630" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Top Bar / Brand Badge -->
  <rect x="80" y="55" width="130" height="34" rx="17" fill="#E50914" fill-opacity="0.15" stroke="#E50914" stroke-opacity="0.4"/>
  <text x="145" y="77" fill="#E50914" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" text-anchor="middle">NETFLIX PLM</text>

  <rect x="225" y="55" width="230" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <text x="340" y="77" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" letter-spacing="0.5" text-anchor="middle">Product Strategy & Churn Teardown</text>

  <text x="1120" y="77" fill="#6B7280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" text-anchor="end">Cohort Retention Modeling 2026</text>

  <!-- Main Headline Banner -->
  <text x="80" y="190" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="700" letter-spacing="-1">GenAI Dynamic Micro-Trailers</text>
  <text x="80" y="235" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="400">Curated Progressive-Choice Discovery Engine to eliminate browse fatigue and subscriber churn</text>

  <!-- Metric Highlights Strip (3 Cards) -->
  <!-- Card 1 -->
  <g transform="translate(80, 280)">
    <rect width="320" height="150" rx="12" fill="#141720" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="28" y="45" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="1" text-transform="uppercase">CHURN REDUCTION</text>
    <text x="28" y="95" fill="#22C55E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="700" letter-spacing="-0.5">-0.15%</text>
    <text x="28" y="125" fill="#6B7280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Monthly cohort churn reduction target</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(440, 280)">
    <rect width="320" height="150" rx="12" fill="#141720" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="28" y="45" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="1" text-transform="uppercase">PROJECTED ARR VALUE</text>
    <text x="28" y="95" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="700" letter-spacing="-0.5">~$60M+</text>
    <text x="28" y="125" fill="#6B7280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Annualized retained recurring revenue</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(800, 280)">
    <rect width="320" height="150" rx="12" fill="#141720" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="28" y="45" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="1" text-transform="uppercase">PROJECTED ROI</text>
    <text x="28" y="95" fill="#E50914" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="700" letter-spacing="-0.5">&gt;15x</text>
    <text x="28" y="125" fill="#6B7280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Modeled return against GenAI GPU infra cost</text>
  </g>

  <!-- Bottom Architecture Diagram Preview -->
  <g transform="translate(80, 465)">
    <rect width="1040" height="135" rx="12" fill="#11141D" stroke="#FFFFFF" stroke-opacity="0.08"/>
    
    <text x="32" y="38" fill="#D1D5DB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">CORE PRODUCT SPECIFICATION & EXPERIMENTATION HIERARCHY</text>
    
    <!-- Flow pills -->
    <rect x="32" y="58" width="220" height="52" rx="8" fill="#1A1F2C" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="48" y="80" fill="#E5E7EB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Browse Inactivity Hook</text>
    <text x="48" y="98" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">&gt;15s catalog hesitation</text>

    <text x="268" y="88" fill="#6B7280" font-family="monospace" font-size="16">→</text>

    <rect x="295" y="58" width="235" height="52" rx="8" fill="#1A1F2C" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="311" y="80" fill="#E5E7EB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Personalized Micro-Trailer</text>
    <text x="311" y="98" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">6s GenAI scene assembly</text>

    <text x="545" y="88" fill="#6B7280" font-family="monospace" font-size="16">→</text>

    <rect x="572" y="58" width="210" height="52" rx="8" fill="#1A1F2C" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="588" y="80" fill="#E5E7EB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Progressive Choice</text>
    <text x="588" y="98" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Preserves user agency</text>

    <text x="797" y="88" fill="#6B7280" font-family="monospace" font-size="16">→</text>

    <rect x="824" y="58" width="184" height="52" rx="8" fill="#1A1F2C" stroke="#22C55E" stroke-opacity="0.3"/>
    <text x="840" y="80" fill="#22C55E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">A/B Metric Guardrail</text>
    <text x="840" y="98" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">30-day cohort retention</text>
  </g>

  <!-- Footer Tagline -->
  <text x="80" y="675" fill="#4B5563" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Designed & Authored by Bilal Choudhary · Product Strategy, PLM Framework & Experimentation</text>

  <!-- Gradients -->
  <defs>
    <radialGradient id="bg_radial" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 200) rotate(90) scale(550 900)">
      <stop stop-color="#E50914" stop-opacity="0.12"/>
      <stop offset="0.6" stop-color="#0B0D11" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>
